name: approval-at-head

# fleet-chezmoi#2386. Thin caller of the ORG-WIDE reusable in the public skyphusion-labs/.github,
# pinned by full sha. That reusable runs the composite action
# .github/actions/approval-at-head at a LITERAL sha, with no checkout, so this PR's
# tree never judges this PR. Re-pin deliberately; a moved pin is a change to the
# judge and is reviewed as one. Required context:
#     approval-at-head / gate
# (caller job id / called job name). Renaming the job id orphans the ruleset entry.
#
# TRIGGERS. pull_request opened/reopened/synchronize, plus merge_group checks_requested
# (#1070, the merge queue; see the queue-ref job). On pull_request it judges every new
# head, including the merge commit update-branch creates, and that run also gives
# the head the workflow run the arrival instrument reads.
#
# NOT pull_request_review, and this is measured, not taste (2026-11-12). Each
# workflow run is its own check suite, and a required context FAILS when any
# suite's latest run of that name failed, even if a newer run in another suite
# passed (skyphusion-strummer/check-resolution-test PR 1: BLOCKED, PUT /merge
# 405). So a review must not produce a second `approval-at-head / gate`. Instead
# approval-at-head-retrigger.yml re-runs THIS run on a review; the re-run is a new
# attempt in the same suite and replaces its check (PR 2: CLEAN, merged, rule
# suite pass).
#
# NO concurrency group, on purpose. A cancel-in-progress group leaves a
# CANCELLED check row on the head, and a queue group cancels the older pending
# run. Each run reads live state and finishes in seconds.
#
# NOT YET REQUIRED. Repo ruleset aviation-grade-repo-approval-at-head will
# require it; it is declared in the org's ruleset declaration and applied only
# after this caller is on main. A required check that does not run blocks every
# PR, so a repo gets this caller BEFORE its ruleset requires it.
#
# COMPOSITION with org ruleset 18677665, which already gates this repo: rulesets
# AGGREGATE. Required contexts are the UNION (ci, coverage, approval-at-head /
# gate). The org layer's strict up-to-date policy and require_last_push_approval
# still apply. Strict means a BEHIND PR needs update-branch, and that new head
# now needs a fresh approval. That cost is the point of the gate.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # MERGE QUEUE (#1070, corrected by #1083). On a merge_group event the queue makes a
  # branch named refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>. The <sha> in that
  # name is NOT the PR head. Measured on the first live queue run (2026-11-20): for
  # #1067 the ref sha was 47521d4c..., the PR head was c0ed21d9...; for #1052 the ref
  # sha was 956687f..., which is main. It is the commit the entry is built on, main or
  # the entry ahead of it. So only N is read from the ref.
  #
  # GitHub's docs (events that trigger workflows, merge_group; webhook events and
  # payloads, merge_group) say a merge group is "a group of pull requests that the merge
  # queue has grouped together", that the event fires "when a merge group is created or
  # added to", and that GITHUB_SHA is the SHA of the merge group. They do not say what
  # the sha in the ref name is, which is why the measurement above is the reference:
  #   https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group
  #   https://docs.github.com/en/webhooks/webhook-events-and-payloads#merge_group
  #
  # The queue-ref job:
  #   1. reads N from github.event.merge_group.head_ref (never from a PR-controlled
  #      field) and refuses a ref that does not parse;
  #   2. reads the PR head sha from the API and refuses a PR that is not open;
  #   3. refuses unless that head is an ancestor of github.event.merge_group.head_sha
  #      (the group commit), so the approval judged is for the code being merged;
  #   4. outputs the PR head sha from the API, not from the ref.
  # approval-at-head-queue then runs the SAME judge, at the same pinned sha, on that PR
  # and head: an APPROVED review at exactly that sha. If queue-ref fails, the judge never
  # runs, no `approval-at-head / gate` is reported, and the queue cannot merge the
  # entry. A missing required check is not a pass.
  #
  # NAMES. The required context is `approval-at-head / gate`. On a merge_group run
  # the queue job is named `approval-at-head`, so its called job `gate` reports that
  # exact context. On a pull_request run it carries another name, and it is skipped,
  # so no second `approval-at-head / gate` can appear in that suite (a skipped
  # required check would count as a pass).
  queue-ref:
    name: approval-at-head-queue-ref
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.parse.outputs.pr }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: read the PR number from the queue branch
        id: parse
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # parse-begin (tests/ci/merge-group-ref-test.sh runs this block)
          set -euo pipefail
          re='^refs/heads/gh-readonly-queue/.+/pr-([1-9][0-9]*)-[0-9a-f]{40}$'
          if [[ ! "$HEAD_REF" =~ $re ]]; then
            echo "::error::merge_group head_ref '$HEAD_REF' is not refs/heads/gh-readonly-queue/<base>/pr-<N>-<40 hex>; refusing"
            exit 1
          fi
          echo "pr=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # parse-end
      - name: the PR is open and its head is in the merge group
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.parse.outputs.pr }}
          MG_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          # verify-begin (tests/ci/merge-group-ref-test.sh runs this block with a stub gh)
          set -euo pipefail
          sha40='^[0-9a-f]{40}$'
          if [[ ! "$MG_SHA" =~ $sha40 ]]; then
            echo "::error::merge_group head_sha '$MG_SHA' is not a 40 hex sha; refusing"
            exit 1
          fi
          pull=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + .head.sha')
          state="${pull%% *}"
          head="${pull#* }"
          if [ "$state" != "open" ]; then
            echo "::error::PR #$PR is '$state', not open; refusing"
            exit 1
          fi
          if [[ ! "$head" =~ $sha40 ]]; then
            echo "::error::PR #$PR head '$head' is not a 40 hex sha; refusing"
            exit 1
          fi
          # compare <PR head>...<group commit>: "ahead" or "identical" means the PR head
          # is an ancestor of the group commit. Anything else, or an API error, refuses.
          rel=$(gh api "repos/$REPO/compare/$head...$MG_SHA" --jq '.status')
          if [ "$rel" != "ahead" ] && [ "$rel" != "identical" ]; then
            echo "::error::PR #$PR head $head is not an ancestor of the merge group $MG_SHA (compare says '$rel'); refusing"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "PR #$PR is open at $head, and $head is in the merge group $MG_SHA ($rel)"
          # verify-end

  approval-at-head-queue:
    name: ${{ github.event_name == 'merge_group' && 'approval-at-head' || 'approval-at-head-queue' }}
    if: github.event_name == 'merge_group'
    needs: queue-ref
    uses: skyphusion-labs/.github/.github/workflows/approval-at-head-reusable.yml@a3412f45b3355b72651fe39e45923921609f93b7
    with:
      pr_number: ${{ fromJSON(needs.queue-ref.outputs.pr) }}
      head_sha: ${{ needs.queue-ref.outputs.sha }}

  approval-at-head:
    if: github.event_name == 'pull_request'
    uses: skyphusion-labs/.github/.github/workflows/approval-at-head-reusable.yml@a3412f45b3355b72651fe39e45923921609f93b7
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
