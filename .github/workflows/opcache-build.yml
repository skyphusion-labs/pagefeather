name: opcache-build

# The b-dosql OPcache build (build.sh, then opcache.sh) on a GitHub-hosted runner, as
# deploy-workers.yml runs it for zarapo and woocap (#371). That build boots the Worker with the
# pinned Wrangler (deploy/wr) in local mode and primes the OPcache. Before #371 it called a bare
# `wrangler`, which a runner does not have, so the deploy failed before any upload and only a deploy
# found out. This runs on the pull request that could break it. No secrets: the build deploys
# nothing and uses no remote binding (opcache.sh runs wrangler dev --local).
on:
  pull_request:
    paths:
      - 'spikes/b2-wordpress/**'
      - 'deploy/deploy.sh'
      - 'deploy/wr'
      - 'deploy/tools/**'
      - '.github/workflows/opcache-build.yml'

permissions:
  contents: read

jobs:
  opcache-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: No wrangler on PATH (the build must use deploy/wr)
        run: |
          if command -v wrangler; then echo "::error::a global wrangler is on the runner PATH; this job could not see a bare call"; exit 1; fi
          echo "no global wrangler: ok"
      - name: Build (b-dosql, WooCommerce primed)
        working-directory: spikes/b2-wordpress
        run: |
          set -euo pipefail
          npm ci --silent
          ./prepare.sh | tail -1
          ./build.sh | tail -1
          # #679: the placeholder image WooCommerce copies at activation is in the PHP tree. The listing goes to
          # a file first: piped into grep -q under pipefail, unzip dies of SIGPIPE at the first match (rc 141).
          unzip -l build/site.zip > build/site-list.txt
          grep -q 'wordpress/wp-content/plugins/woocommerce/assets/images/placeholder-attachment.webp' build/site-list.txt \
            || { echo "::error::site.zip has no WooCommerce placeholder-attachment.webp (#679)"; exit 1; }
          s=$(date +%s)
          if DEV_ENV=dosql-local WOO_ACTIVE=1 ./opcache.sh > build/opcache.log 2>&1; then
            tail -1 build/opcache.log
            echo "opcache.sh took $(( $(date +%s) - s )) s"
          else
            echo "::error::opcache.sh failed; last lines of build/opcache.log and dev.log:"
            tail -40 build/opcache.log; echo '--- dev.log'; tail -40 dev.log 2>/dev/null || true
            exit 1
          fi
      - name: The request frame off and on, end to end on workerd, with its cost measured (issue #352)
        # On the primed bundled build (before the remote steps, which empty the zips): e2e.sh and woo.py
        # both ways, then 10 saves, 10 post-new GETs and 10 public GETs read for dbMs, rows and frame.
        working-directory: spikes/b2-wordpress
        run: |
          if ! tests/frames-e2e.sh; then
            echo "::error::frames-e2e.sh failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
      - name: The #598 reproducer flipped by #603, the recycle loop, the boot race, the bounded gate (issue #603)
        # recycle-stack-e2e.sh: the deploy flow and two forced recycles; with PHP_MEMORY_REUSE and BOOT_GATE on, ONE
        # live memory each time; with both off it must FAIL with the VIOLATION (the stacking is still reproduced).
        # recycle-loop-e2e.sh (#603 A): three requests on an inherited memory above the line, no recycle.
        # boot-race-e2e.sh (#603 B): a drop in the middle of a boot leaves one runtime (the BOOT_TEST_DELAY_MS seam).
        # boot-gate-e2e.sh: a refused operator boot is the known 503, decided per request, never past the bound.
        # spare-persist-e2e.sh (#724 review, 1): a boot 35 s after a recycle reuses the spare (no TTL).
        # runcron-boot-e2e.sh (#724 review, 2): /_runcron runs on the current runtime and boots nothing.
        # rest-list-memory-e2e.sh (#728): a REST list over 120 pages of 512 KiB loads no content it does not answer with;
        # a list that would load too much is a 400 rest_list_too_large before any row loads; ordinary lists unchanged.
        # false-404-e2e.sh (#766): a SQL failure at the memory ceiling never makes later requests answer 404 for a product
        # that exists (the failing request's object-cache writes are dropped); injected with FAULT_INJECT=sql-fail.
        # failed-read-rollback-e2e.sh (#794): a value derived from a failed read (an add_option default over a real value)
        # does not persist: the frame is rolled back on a reset-class failure, and the answer says rolled-back.
        working-directory: spikes/b2-wordpress
        run: |
          for t in tests/recycle-stack-e2e.sh tests/recycle-loop-e2e.sh tests/boot-race-e2e.sh tests/boot-gate-e2e.sh tests/spare-persist-e2e.sh tests/runcron-boot-e2e.sh tests/rest-list-memory-e2e.sh tests/false-404-e2e.sh tests/failed-read-rollback-e2e.sh; do
            if ! "$t"; then echo "::error::$t failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1; fi
          done
          # #724 review, finding 4: the drop lands inside instantiation, after the boot took the spare
          if ! AT=instantiate tests/boot-race-e2e.sh; then echo "::error::boot-race-e2e.sh (AT=instantiate) failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1; fi
          if REUSE=off GATE=off tests/recycle-stack-e2e.sh > build/recycle-red.log 2>&1; then
            echo "::error::recycle-stack-e2e.sh passed with reuse off: the reproducer no longer reproduces"; cat build/recycle-red.log; exit 1
          fi
          grep 'VIOLATION' build/recycle-red.log || { echo "::error::the red run failed for another reason"; cat build/recycle-red.log; exit 1; }
      - name: ALL OPcache files as remote packs, end to end on workerd (issue #563, OPCACHE_REMOTE, no split; and #801, the #394 L1 split)
        # On the primed build above: the trace, opcache-remote.py, then tests/remote-e2e.sh runs the
        # pages, the admin and the store three ways (remote packs, cap 0, off). Each must work.
        working-directory: spikes/b2-wordpress
        run: |
          set -euo pipefail
          s=$(date +%s)
          if ! WOO_ACTIVE=1 DEV_ENV=dosql-local ./file-trace.sh > build/file-trace.log 2>&1; then
            echo "::error::file-trace.sh failed"; tail -30 build/file-trace.log; exit 1
          fi
          # #801: #394 L1 (OPCACHE_SPLIT=1) is off everywhere (the 2026-11-13 ruling) and kept in main as inert code, so
          # it is tested here or it rots unseen: the split of this primed, traced build, tests/l1-e2e.sh on it (the boot
          # pack from Assets, the forced compile fallback, the split off; /_pf/ never served), then build/ put back
          # EXACTLY, because opcache-split.py rewrites build/opcache.zip and opcache-remote.py below reads it.
          cp -a build "$RUNNER_TEMP/l1-build"
          python3 -I opcache-split.py build/opcache.zip build/file-trace.json build/build-id.js
          if ! tests/l1-e2e.sh; then
            echo "::error::l1-e2e.sh (#394 L1, the OPcache split) failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
          rm -rf build && mv "$RUNNER_TEMP/l1-build" build
          python3 -I opcache-remote.py build/opcache.zip build/file-trace.json build/build-id.js
          # #569 (#394 Gate 2): the site.zip read pattern and the simulated fetches per request, from
          # the same trace (a measurement; site.zip is untouched by opcache-remote.py).
          python3 -I site-trace-report.py build/site.zip build/file-trace.json build/opcache-remote-index.js
          grep -E 'cold|warm' build/file-trace-admin.log || true
          if ! tests/remote-e2e.sh; then
            echo "::error::remote-e2e.sh failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
          # #569 (SITE_REMOTE): site.zip to packs as well (it empties site.zip, so it runs last), then the
          # same three cases with the site served only from packs.
          python3 -I site-remote.py build/site.zip build/file-trace.json build/build-id.js
          if ! REMOTE_E2E_SITE=1 tests/remote-e2e.sh; then
            echo "::error::remote-e2e.sh (site) failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
          echo "remote steps took $(( $(date +%s) - s )) s"
