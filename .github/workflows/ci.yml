name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Same pin as spikes/b2-wordpress/build.sh.
  SQLITE_DI_REF: f05c1f9
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ubuntu-latest ships PHP 8.3. Third-party actions are not on the org allowlist.
      - run: php -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Terraform 1.17.1 (checksum-verified)
        # Not hashicorp/setup-terraform: the org allowlist refuses it (run 43196743912), and the
        # lead ruled against widening the allowlist for one job (#336). Same pattern as ggc ci.yml.
        # The sha256 is HashiCorp's own SHA256SUMS line for this zip; a mismatch stops the job here.
        # Early on purpose: custom-domain-test.sh and tf-clean-test.sh skip their terraform half
        # when terraform is not on PATH, so an install after them leaves those halves unrun.
        run: |
          set -euo pipefail
          ver=1.17.1
          zip="terraform_${ver}_linux_amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${ver}/${zip}"
          if ! echo "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061  $RUNNER_TEMP/$zip" | sha256sum -c -; then
            echo "::error::terraform ${ver} zip sha256 mismatch; refusing to install it"
            exit 1
          fi
          sudo unzip -o -q "$RUNNER_TEMP/$zip" -d /usr/local/bin
          terraform version
      - name: Fetch the SQLite driver
        run: |
          git clone -q https://github.com/WordPress/sqlite-database-integration spikes/b2-wordpress/build/cache/sqlite-database-integration
          git -C spikes/b2-wordpress/build/cache/sqlite-database-integration checkout -q "$SQLITE_DI_REF"
      - name: PHP syntax
        run: for f in spikes/b2-wordpress/php/*.php spikes/b2-wordpress/tests/*.php deploy/import/*.php; do php -l "$f"; done
      - name: JS syntax
        # The Workers are ES modules but package.json says commonjs, so check them as .mjs.
        run: |
          for f in spikes/b1-boot/index.js spikes/b2-wordpress/index.js spikes/b2-wordpress/sql-import.js spikes/c1-woo-container/worker.js spikes/c1-woo-container/warm.js; do cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs"; done
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: No process substitution in the macOS-run scripts (macOS /bin/bash 3.2 leaks one fd each)
        run: |
          set -u
          # e2e.sh and the build scripts run on an operator's Mac under /bin/bash 3.2, where every
          # process substitution keeps a descriptor open until the enclosing function returns.
          # #578's asset loop hit the limit and the local build died with SIGTRAP. #580 refused
          # only the redirect form. #581 refuses every one outside a comment. CI's bash 5 does
          # not leak, so this guard is what catches it. The test also runs the guard on a fixture.
          hits=$(grep -nE '<\(' spikes/b2-wordpress/*.sh deploy/wfp/*.sh deploy/wfp/site | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then echo "process substitution found:"; echo "$hits"; exit 1; fi
          echo "no process substitution in the macOS-run scripts"
          tests/ci/no-process-sub-test.sh
      - name: Merge queue gate (#1070)
        # approval-at-head.yml reads the PR and head sha from the queue branch name. This runs the
        # REAL parse block on good and bad refs, and checks the three workflows answer merge_group.
        run: tests/ci/merge-group-ref-test.sh
      - name: Release bundle manifest (issue #405)
        # deploy/release: the manifest the one-click admin checks a downloaded bundle against. Offline.
        run: |
          node deploy/release/tests/bundle-manifest-test.mjs
          node deploy/release/tests/vendor-sync-test.mjs
      - name: Release notices, SOURCE and NOTICE (issue #584)
        # A bundle that ships an engine must carry LICENSES.tar.gz, SOURCE and NOTICE.
        # Offline: committed texts at the pins in engine/licenses.tsv, no fetch.
        run: bash deploy/release/tests/release-notices-test.sh
      - name: a product bundle ships the notices of the engine it built; approach A defaults to the lean engine (#771, #1027)
        run: bash deploy/release/tests/bundle-notices-test.sh
      - name: the lean engine prerelease is assembled only from the pinned bytes, with its notices (#771)
        run: bash engine/tools/publish-lean-test.sh
      - name: Live-site code redeploys refuse a mismatch (fleet-chezmoi#2620)
        run: |
          bash deploy/tests/code-only-test.sh
          bash deploy/tests/deploy-url-test.sh
          bash deploy/tests/serving-version-test.sh
          python3 -I deploy/live-sites/tests/check-live-test.py
      - name: Approach A admin fixes behind settings, the measured site's render (#666), and the D1 trace cut to A's zips (#394)
        # deploy/a-settings.sh through deploy.sh (refusals before any step, behind a stub fence), its
        # rendered lines against remote_assets_check.py; trace-filter.py with the real pack scripts.
        run: |
          bash deploy/tests/a-settings-test.sh
          bash deploy/tests/activate-installed-test.sh
          bash deploy/tests/dosql-remote-test.sh
          bash deploy/tests/a-remote-test.sh
          bash deploy/tests/fault-inject-test.sh
          bash deploy/tests/page-cache-ttl-test.sh
          bash deploy/tests/conformance-test.sh
          bash deploy/tests/opcache-store-test.sh
          bash deploy/tests/pdf-invoice-wiring-test.sh
          bash deploy/tests/frames-default-test.sh
          bash deploy/tests/a-render-test.sh
          bash deploy/tests/page-cache-product-test.sh
          bash deploy/tests/observability-test.sh
          bash deploy/tests/media-guard-test.sh
          bash deploy/tests/cron-schedules-test.sh
          bash deploy/tests/recorded-inputs-test.sh
          bash deploy/tests/custom-domain-test.sh
          bash deploy/tests/cron-version-readback-test.sh
          bash spikes/b2-wordpress/tests/trace-filter-test.sh
      - name: doctor reads Workers Logs and never reports zero rows or console-only logs as healthy (#652)
        # deploy/doctor against a fake telemetry API that fails any call it does not expect: no rows, a
        # wrong name, console lines only, outcome rows, server-side percentiles, a busy window in a few
        # calls, redaction off, and no query string, SQL, client IP or token in the output.
        run: |
          bash -n deploy/doctor
          python3 -I deploy/doctor-lib/tests/doctor-test.py
      - name: Wrangler is pinned and called through deploy/wr
        # deploy/tools holds the exact version; a bare npx call runs whatever is installed or the latest.
        run: bash deploy/tests/wrangler-pin-test.sh
      - name: Deploy scripts keep the spike token and admin password out of curl's command line
        # -K <(printf 'header = ...') instead of -H: the value is not in the process list.
        run: bash deploy/tests/curl-argv-test.sh
      - name: /_install retries until the site is installed (#811)
        # A stub answers 403, then the install JSON. A stub that never installs fails the step.
        run: bash deploy/tests/install-retry-test.sh
      - name: Dialect tests
        run: php spikes/b2-wordpress/tests/dialect-test.php
      - name: Engine tests that ran in no workflow (#1010)
        # Each was checked by a mutation: with its code under test broken, the test exits non-zero.
        run: |
          php spikes/b2-wordpress/tests/comment-rest-headroom-test.php
          php spikes/b2-wordpress/tests/wp-mail-queue-test.php
          node --test spikes/b2-wordpress/tests/slash-path.test.mjs
          node --test spikes/b2-wordpress/tests/purge-after-php.test.mjs
          node --test spikes/b2-wordpress/tests/template-boot.test.mjs
          node --test spikes/b2-wordpress/tests/ocv-missing.test.mjs
          node --test spikes/b2-wordpress/tests/remote-perf-boot.test.mjs
      - name: WP-CLI allowlist under the code lock (issue #1258)
        # wp-cli-allow.mjs decides. WP-CLI does not read DISALLOW_FILE_MODS.
        # user list and user get refuse user_pass and user_activation_key.
        run: node --test spikes/b2-wordpress/tests/wp-cli-allow.test.mjs
      - name: WP-CLI operator endpoint (issue #1258)
        # Off unless WP_CLI_ENDPOINT=on. Access JWT plus the spike token. 404 on a miss.
        run: |
          node --test spikes/b2-wordpress/tests/wp-cli-endpoint.test.mjs
          bash deploy/tests/wp-cli-endpoint-test.sh
          bash spikes/b2-wordpress/tests/wp-cli-bundle-test.sh
      - name: Every engine test is named in a workflow (#1010)
        # A *-test.php or *.test.mjs under spikes/b2-wordpress/tests/ that no workflow names fails this step.
        run: bash tests/ci/engine-tests-wired-test.sh
      - name: A new month upload returns JSON with no chmod warning (issue #594)
        # php/r2-uploads.php: the uploads root is a directory when the bucket is empty,
        # so wp_mkdir_p chmod()s the r2 stream and not a plain path that does not exist.
        run: php spikes/b2-wordpress/tests/upload-month-json-test.php
      - name: A deleted upload frees its reserved file name (#946)
        # The reserve row outlives the file. The next upload then gets a -1 suffix.
        # Delete and move release the row. The options fallback does too.
        run: |
          node --test spikes/b2-wordpress/tests/r2-reserve.test.mjs
          php spikes/b2-wordpress/tests/r2-reserve-release-test.php
      - name: Approach A literal tests (issue #79)
        run: php tests/a/literals-test.php
      - name: "A PHP fatal or a 500 wp_die reaches the Worker as one scrubbed line (#1153)"
        run: php spikes/b2-wordpress/tests/php-fatal-line-test.php
      - name: "WordPress URL checks resolve hosts for real, every address public (#1156)"
        run: |
          node --test spikes/b2-wordpress/tests/dns-public.test.mjs
          php spikes/b2-wordpress/tests/http-external-dns-test.php
      - name: "Approach A: a cold isolate primes the learned not-autoloaded options in one query (#1090)"
        run: php spikes/b2-wordpress/tests/option-prime-test.php
      - name: The query trace, operator only and measure only (#296 step 3)
        run: |
          php spikes/b2-wordpress/tests/hyperdrive-qtrace-test.php
          node --test spikes/b2-wordpress/tests/qtrace.test.mjs
      - name: WooCommerce HPOS Data Caching for approach A, default off (#697)
        run: |
          node --test spikes/b2-wordpress/tests/woo-hpos-cache.test.mjs
          php spikes/b2-wordpress/tests/woo-hpos-cache-test.php
          php spikes/b2-wordpress/tests/woo-cart-page-test.php
          php spikes/b2-wordpress/tests/permalinks-test.php
          php spikes/b2-wordpress/tests/woo-blocks-scope-test.php
          php spikes/b2-wordpress/tests/app-password-headroom-test.php
          php spikes/b2-wordpress/tests/product-save-headroom-test.php
          php spikes/b2-wordpress/tests/navigation-rest-headroom-test.php
          php spikes/b2-wordpress/tests/wc-route-defer-scope-test.php
          node --test spikes/b2-wordpress/tests/object-cache-cap.test.mjs
          bash spikes/b2-wordpress/tests/same-site-test.sh
          php spikes/b2-wordpress/tests/table-status-size-test.php
          php spikes/b2-wordpress/tests/plain-404-test.php
          php spikes/b2-wordpress/tests/plugin-activate-fatal-test.php
      - name: Code assets use a one year browser cache (#605)
        # Workers static assets default to max-age=0. The block editor then revalidates each script.
        run: bash spikes/b2-wordpress/tests/asset-headers-test.sh
      - name: Approach A object cache isolated mode (issue #218)
        # spikes/b2-wordpress/php/object-cache-js.php: the allowlist + TTL + force-off
        # posture, with a stubbed bridge (no DB). WooCommerce groups never persist.
        run: php spikes/b2-wordpress/tests/object-cache-isolated-test.php
      - name: approach A keeps FOUND_ROWS and LAST_INSERT_ID on one pooled connection (issue #498)
        run: php tests/a/found-rows-test.php
      - name: Page cache versions, exact invalidation on approach A (#296)
        run: node --test spikes/b2-wordpress/tests/page-versions.test.mjs
      - name: A page-cache purge that fails after PHP answers is retried, never swallowed (#1007, #935)
        run: node --test spikes/b2-wordpress/tests/purge-after-php.test.mjs
      - name: approach A object-cache KV writes are coalesced and 429s counted (issue #500)
        # #711: oc-l2-writer.test.mjs also asserts `last` stays within 1024 entries and 2 MiB.
        run: node --test spikes/b2-wordpress/tests/oc-l2-writer.test.mjs
      - name: b-dosql the request frame answers "nothing saved" only on the /_frame proof (issue #352)
        run: node --test spikes/b2-wordpress/tests/frame-probe.test.mjs
      - name: /_install keeps its runtime, sets site timezone, and titles the site (#756, #759, #1098)
        run: node --test spikes/b2-wordpress/tests/install-keeps-runtime.test.mjs spikes/b2-wordpress/tests/install-timezone.test.mjs spikes/b2-wordpress/tests/install-title.test.mjs
      - name: b-dosql approach-A options never persist across isolates (issue #491)
        run: php spikes/b2-wordpress/tests/object-cache-491-test.php
      - name: "Transients are durable with the object cache on: a transient set in one runtime is read in a fresh one (#1199)"
        run: php spikes/b2-wordpress/tests/object-cache-transients-test.php
      - name: approach A options persist across isolates under an exact version, never stale (#296)
        run: |
          php spikes/b2-wordpress/tests/object-cache-options-versions-test.php
          node --test spikes/b2-wordpress/tests/cache-versions.test.mjs
      - name: Approach A object cache source invariants (issue #218)
        # spikes/b2-wordpress/index.js: the approach-A gate, the x-oc-off bracket, and
        # the per-table / per-group instrumentation, as shipped-source invariants.
        run: node spikes/b2-wordpress/tests/oc-isolated-test.mjs
      - name: Import tests
        # deploy/import (issue #31): dump to SQLite, prefix, site address, dbmove dump. Offline.
        run: deploy/import/tests/run.sh
      - name: approach A /_sqlimport reaches the PhpRuntime object when PHP_IN_DO=on (issue #551)
        # The front Worker used to pass a null db, so the route answered 404. It now
        # goes to the object, which runs it with that isolate's MySQL client. A fake
        # client only: no Cloudflare account and no live site.
        run: node --test spikes/b2-wordpress/tests/sqlimport-do.test.mjs
      - name: Import media refusal tests
        # deploy/import/media.sh (issue #124): a refused or failed HEAD is retried, then fails; it never counts as missing.
        run: deploy/import/tests/media-refuse-test.sh
      - name: Import media uses a temporary R2 credential, not an account token (issue #1031)
        # deploy/import.sh media_step: one mint for the media bucket (deploy/wfp/r2_temp.py), no Terraform apply,
        # and a refused mint sends nothing. Against deploy/wfp/tests/fake-r2-temp.py; no account.
        run: deploy/import/tests/media-mint-test.sh
      - name: plugin-memory.py never counts a page-cache copy as a fresh runtime (issue #344)
        # A fake site on localhost replays cached x-boot 1, as the page cache does. The case that
        # reproduces the old probe needs git history and skips in a shallow checkout.
        run: python3 -I tests/wfp/plugin-memory-test.py
      - name: Gate 2 plugin harness, offline (#426)
        # tests/plugins/gate2.py against a fake WordPress: the four read-back classes, write-loss, headers-only recording.
        run: |
          python3 -I tests/plugins/gate2_test.py
          # the CMS phase (#422): editor, media, menus, widgets, site editor or customizer, settings, users, comments
          python3 -I tests/plugins/cms_test.py
          bash tests/fixtures/tests/theme-unit-test.sh
          # fetch.sh (#457): THEMES, the unpinned-slug refusal, the SHA, link and parent-theme refusals.
          bash tests/plugins/fetch-test.sh
      - name: Conformance content and runner, offline (#759)
        # prepare-content.sh against stub git repos, into the real deploy/import/content.sh; runner.py
        # against a stub WordPress: the throwaway marker, the deny list, the #761 Basic stop, the cache
        # label, no password in the output, the wrapper configs (node --check) and the baseline compare.
        # vps-gb-browsers-test.sh (#1000): install gb fetches chromium, firefox and webkit. DRY, no download.
        run: |
          bash tests/conformance/prepare-content-test.sh
          bash tests/conformance/vps-collect-test.sh
          bash tests/conformance/vps-gb-browsers-test.sh
          python3 -I tests/conformance/runner_test.py
          python3 -I tests/conformance/matrix_test.py
          python3 -I tests/conformance/gaps_test.py
          bash tests/conformance/gaps-php-test.sh
          python3 -I tests/conformance/seed-test.py
          python3 -I tests/conformance/routes-test.py
      - name: conformance upload persistence probe against a stub (#759)
        run: python3 -I tests/conformance/media_probe_test.py
      - name: conformance on Cloudflare Browser Run, the CDP preload against a stub (#759)
        run: node --test tests/conformance/browser-run.test.mjs
      - name: b-dosql mail From address
        run: node --test spikes/b2-wordpress/tests/mail-from.test.mjs
      - name: b-dosql demo site lock
        run: node --test spikes/b2-wordpress/tests/site-lock.test.mjs
      - name: Admin memory trace is operator-only, and its harness summary (#434)
        run: |
          node --test spikes/b2-wordpress/tests/mem-trace.test.mjs
          python3 -I tests/wfp/admin-mem-test.py
      - name: Memory trace hooks mode against WordPress's own hook code (#504)
        # The three wp-includes files of the pinned WordPress (spikes/b2-wordpress/build.sh
        # WP_VERSION=7.1.5; the three files are unchanged from 7.1.4), each checked against its sha256 (equal to the copies in the
        # sha1-verified release zip) before the test reads them.
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/wp-includes"
          mkdir -p "$d"
          for f in plugin.php:d70b9e18d34ab3fe46e15548a5e8e089ea5920832f06a4d89a9d64b2f7938b0d \
                   class-wp-hook.php:b839c0e5672246bca8db1ab781ec8835f7732f253c375a237cbf6ec536e8d12e \
                   class-wp-filter-sentinel.php:68c9c675d3805a343835728d98a0efedf0df9833cb904bebf909c7e0fda5c61c; do
            name="${f%%:*}"; sum="${f##*:}"
            curl -fsSL -o "$d/$name" "https://raw.githubusercontent.com/WordPress/WordPress/7.1.5/wp-includes/$name"
            echo "$sum  $d/$name" | sha256sum -c - || { echo "::error::$name sha256 mismatch"; exit 1; }
          done
          php spikes/b2-wordpress/tests/mem-trace-hooks-test.php "$d"
      - name: b-dosql rows-only export for a store move, against a real SQLite (#479)
        run: node --test spikes/b2-wordpress/tests/mysql-export.test.mjs
      - name: b-dosql performance headers need the spike token
        run: node --test spikes/b2-wordpress/tests/perf-headers.test.mjs
      - name: b-dosql the Pages entrypoint stamps its render time, so a cached copy can be told from a fresh one (#628)
        run: node --test spikes/b2-wordpress/tests/page-stamp.test.mjs
      - name: b-dosql a shorter edge TTL for product pages, off by default, and the mark never leaves (#628 C2)
        run: |
          node --test spikes/b2-wordpress/tests/page-cache-ttl.test.mjs
          php spikes/b2-wordpress/tests/edge-cache-product-test.php
          # #704: edge-cache.php names why it asks a purge, and the Worker logs it as m: purge-why
          php spikes/b2-wordpress/tests/edge-cache-why-test.php
          # #704: a checkout asks no purge (an HPOS order id, its notes); real changes still purge
          php spikes/b2-wordpress/tests/edge-cache-704-test.php
          node --test spikes/b2-wordpress/tests/purge-why.test.mjs
          # #699: a refused purge stays pending with a back-off, and expires only after TTL + stale-while-revalidate.
          node --test spikes/b2-wordpress/tests/purge-state.test.mjs
          # #699 part B: the account purge budget. Its rules, the site's fail-open client, the alarm's shape, the deploy
          # side (presence, the binding, who still binds it), and the load-test driver against a stub.
          node --test deploy/purge-budget/tests/budget-state.test.mjs
          node --test spikes/b2-wordpress/tests/purge-budget-client.test.mjs
          node --test spikes/b2-wordpress/tests/purge-budget-wiring.test.mjs
          bash deploy/purge-budget/tests/budget-sh-test.sh
          python3 -I deploy/purge-budget/tests/binders-test.py
          python3 -I tests/load/purge-pressure-test.py
          bash deploy/wfp/tests/page-cache-product-test.sh
      - name: b-dosql a memory reset is not an overload (issue #335)
        # object-error.mjs: an isolate memory reset answers x-isolate-reset, never x-overloaded.
        run: |
          node --test spikes/b2-wordpress/tests/object-error.test.mjs
          node --test spikes/b2-wordpress/tests/opcache-size.test.mjs
      - name: a doubled slash redirects only GET, HEAD and OPTIONS (issue #1005)
        # A 301 on POST //wp-json/wc/v3/orders is followed as GET, so the body is lost.
        run: node --test spikes/b2-wordpress/tests/slash-path.test.mjs
      - name: b-dosql a PHP object that does not start answering fails fast (issue #605)
        # object-deadline.mjs: abort a stub.fetch that has not started answering within
        # OBJECT_CALL_DEADLINE_S and answer 503 x-object-deadline, or write-loss when the
        # method may have written. Install, import, sqlimport and cron are not cut.
        run: node --test spikes/b2-wordpress/tests/object-deadline.test.mjs
      - name: b-dosql a write lost to an isolate reset never answers success (issue #350)
        # write-loss.mjs: a 500 "may have been saved", no Retry-After, no Set-Cookie, on both reset paths; GET and HEAD keep the #349 retry.
        run: node --test spikes/b2-wordpress/tests/write-loss.test.mjs
      - name: b-dosql a request with lost writes holds its mail (issue #368)
        run: node --test spikes/b2-wordpress/tests/request-mail-hold.test.mjs
      - name: b-dosql bundle file trace, route classes (issue #394 M0)
        run: node --test spikes/b2-wordpress/tests/file-trace.test.mjs
      - name: b-dosql OPcache split into warm and boot (issue #394 L1)
        run: python3 -I spikes/b2-wordpress/tests/opcache-split-test.py
      - name: b-dosql every OPcache file to packs in cold-boot read order, opcache.zip empty, no boot pack (issue #563)
        run: python3 -I spikes/b2-wordpress/tests/opcache-remote-pack-test.py
      - name: b-dosql the site.zip trace report reads hand-computed fetches right (issue #569)
        run: python3 -I spikes/b2-wordpress/tests/site-trace-report-test.py
      - name: b-dosql site.zip to a hot pack and cold-boot-ordered packs, site.zip empty (issue #569)
        run: python3 -I spikes/b2-wordpress/tests/site-remote-pack-test.py
      - name: measure394 read-back states, a failed read is never an absent row (issue #519)
        run: python3 -I spikes/b2-wordpress/tests/measure394-state-test.py
      - name: break_lib records the first failed SQL statement when asked (#638)
        run: python3 -I spikes/b2-wordpress/tests/break-lib-first-failure-test.py
      - name: login and Store API checkout send the Turnstile test token when set (#718)
        run: python3 -I spikes/b2-wordpress/tests/turnstile-tools-test.py
      - name: measure394 tallies each REST write by answer, read-back and frame state (#589)
        run: python3 -I spikes/b2-wordpress/tests/measure394-tally-test.py
      - name: measure394 REST create body, opt-in content for the post-write window (#589)
        run: python3 -I spikes/b2-wordpress/tests/measure394-body-test.py
      - name: measure394 FAULT_EVERY and the paged title read-back (#730, #589 B)
        run: python3 -I spikes/b2-wordpress/tests/measure394-fault-test.py
      - name: b-dosql runtime guards, raw sockets and PHP messages (issue #452)
        run: node --test spikes/b2-wordpress/tests/runtime-guards.test.mjs
      - name: b-dosql a recycled PHP runtime is released (issue #394)
        run: node --test spikes/b2-wordpress/tests/release-runtime.test.mjs
      - name: b-dosql the recycle line, RECYCLE_WASM_MIB, and the ledger's current runtime (issue #598)
        run: node --test spikes/b2-wordpress/tests/recycle-line.test.mjs
      - name: "A rejected email is retried with backoff, then dead-lettered; Site Health shows the dead (#1057)"
        run: |
          node --test spikes/b2-wordpress/tests/email-retry.test.mjs
          php spikes/b2-wordpress/tests/mail-retry-health-test.php
      - name: "The idle cron gate: no PHP boot when nothing is due, back-off, never past the next event (#390)"
