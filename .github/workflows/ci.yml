        # -backend=false, so no state and no credential: the providers come from the registry.
        run: deploy/wfp/tests/tf-test.sh
      - name: deploy/destroy.sh checks (offline)
        # deploy/tests/destroy-test.sh (deploy/README.md) was in no workflow, so it never ran (#527).
        # It needs the cloudflare provider of deploy/terraform: init with -backend=false (no state,
        # no credential) and -lockfile=readonly (the tracked lock file must not change), then the
        # lock file is checked unchanged so the later steps see a clean tree.
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false -lockfile=readonly >/dev/null
          git diff --exit-code deploy/terraform/.terraform.lock.hcl
          deploy/tests/destroy-test.sh
      - name: c1 load analysis tests
        # tests/load/c1_arm.py (issue #99): held requests, CPU per order, the split, on a synthetic job.
        run: python3 tests/load/c1_arm_test.py
      - name: c1 warm start split tests
        # tests/load/warm_start.py split() (issue #92): the start steps and the PHP time of the add to cart, from synthetic container logs.
        run: python3 tests/load/warm_start_test.py
      - name: c1 mail tests
        # php/c1-mail.php, Store.sendMail in worker.js, the mail config and deploy check (issue #104).
        run: |
          php spikes/c1-woo-container/tests/mail-test.php
          node spikes/c1-woo-container/tests/mail-worker-test.mjs
          deploy/variants/tests/c1-mail-config-test.sh
      - name: R2 empty tests
        # deploy/variants/r2-empty.sh (issue #115): a 403 on the list or a delete is retried for a bounded time.
        run: deploy/variants/tests/r2-empty-test.sh
      - name: Onboarding Phase 1 Hyperdrive config tests (issue #240)
        # deploy/onboard: provider choice to a caching-disabled Hyperdrive config,
        # the SQL_MODE contract, Azure reuse, the PlanetScale direct-host guard. Offline.
        run: |
          node deploy/onboard/tests/hyperdrive-test.mjs
          node deploy/onboard/tests/onboard-test.mjs
      - name: Licence tarballs are read from a local directory, and a missing one names the row (issue #604)
        # engine/tools/licenses-test.py: a fake archive and its pinned sha256, with no network; a
        # missing archive fails and names the row; an HTML 200 is not retried.
        run: python3 -I engine/tools/licenses-test.py
      - name: No em or en dashes
        # -I skips binary files. A gzip matched these code points by chance while its
        # text had none (#593). The test runs this same git grep: it must fail on a
        # text file that holds an em dash and pass on a binary file with those bytes.
        run: |
          tests/ci/no-em-en-dash-test.sh
          if git grep -nIP '\x{2014}|\x{2013}' -- . ':!**/package-lock.json'; then echo 'em or en dash found'; exit 1; fi
      - name: Secret scan
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}|cfut_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|xox[bap]-[A-Za-z0-9-]{10,}'; then echo 'possible secret'; exit 1; fi
      # Node 24 runs the JSPI loader (Node 22 cannot). The Python floor at the
      # end of this job does not use Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: PHP heap views past the 128 MiB ArrayBuffer limit (issue #518)
        # prepare.sh builds the loader with the heap subarray patch; the test boots it with an
        # injected limit, and a copy without the patch must fail as production did.
        working-directory: spikes/b2-wordpress
        run: |
          npm ci --silent --no-audit --no-fund
          ./prepare.sh
          node --test tests/heap-subarray.test.mjs
      - name: A missing engine precondition skips outside CI and fails in CI (issue #1241)
        # The six suites that need --expose-gc, the lean loader, a lazy-body engine, or
        # MAGIC_FILE. This step runs them both ways. prepare.sh above vendors the pinned
        # lean engine: full fileinfo database, no lazy bodies.
        run: node --test spikes/b2-wordpress/tests/require-env.test.mjs
      - name: engine-contract.mjs removes its engine582 temp dir on exit (issue #612)
        # Imports the real module. Reuses the npm ci in the step above (@php-wasm/universal).
        # Does not boot the engine, so it does not need prepare.sh.
        working-directory: spikes/b2-wordpress
        run: |
          node --test tests/engine-contract-tmpdir.test.mjs
          node --test tests/engine-expect-default.test.mjs
      - name: The pagefeather engine's runtime contract, and each check red on the unpatched upstream engine (issue #582)
        # Boots the prepared engine: loader, extensions, OPcache under SAPI wasm, initial memory, allocator,
        # clock, heap growth, heap views, the open and read hooks, promising exports. Each check must also
        # fail on the npm 3.1.62 artifact as shipped (or on a targeted mutation), so none can pass vacuously.
        working-directory: spikes/b2-wordpress
        run: node --test tests/engine-contract.test.mjs
      - name: The memory transform with no reuse, a pre-transform build fails safe, the ledger counts memories once (issue #598)
        # memory-transform: each boot of the transformed engine gets a new memory of the module limits, and the same
        # engine built BEFORE the transform still runs under this loader, on its own memory.
        # mem-ledger-identity: one memory under two runtimes is one live memory, collected once. prepare-idempotent:
        # the transform run twice gives the same bytes, a transformed wasm passes through, a memoryless one is refused.
        working-directory: spikes/b2-wordpress
        run: |
          node --test tests/memory-transform.test.mjs
          node --expose-gc --test tests/mem-ledger-identity.test.mjs
          tests/prepare-idempotent-test.sh
      - name: A recycled runtime hands its memory to the next boot; the boot gate is bounded and never waits (issue #603)
        # memory-reuse: one memory across three runtimes by identity (red on upstream), a runtime retired mid-call
        # drains before its memory is handed on, the spare persists (no TTL), the real release sequence, the module
        # imports check. boot-gate: the arithmetic, the bound, one conversion point. cron-deferred: a refused cron boot
        # is a deferral, resolved inside the PHP lock.
        working-directory: spikes/b2-wordpress
        run: node --expose-gc --test tests/memory-reuse.test.mjs tests/boot-gate.test.mjs tests/cron-deferred.test.mjs tests/reuse-flag-off.test.mjs
      - name: The allocator reading of /_memprobe and the memory trace (issue #547)
        # Boots the loader the step above built with USE_ZEND_ALLOC 0 and 1; each reader must tell them apart.
        working-directory: spikes/b2-wordpress
        run: node --test tests/allocator-reading.test.mjs
      - name: OPcache files fetched while PHP pauses in open(), fail clean, a streaming held budget, default off (issue #563)
        # The real loader and PHP: a remote OPcache pack is used only when fetched and checked; a 404,
        # a short pack, a SHA-256 mismatch and the fetch cap each give a clean compile from source; a
        # loader copy without the import-pattern edit must NOT use the pack; no hook, no wrapped open().
        working-directory: spikes/b2-wordpress
        run: node --test tests/opcache-remote.test.mjs tests/remote-packs.test.mjs
      - name: site files fetched while PHP pauses in open(), one retry, pinned while open, stat makes no fetch (issue #569)
        # The real loader, PHP and attachLazyContents: an open file read half, then other packs, must come
        # back whole with the pin and must NOT without it; a 40,000-call stat storm makes 0 fetches.
        working-directory: spikes/b2-wordpress
        run: node --test tests/site-remote.test.mjs
      - name: php-wasm calls no export that cannot suspend; our code reads no site .php directly (issue #569)
        # A read inside an export outside exportPattern throws SuspendError (Gate 0b); a failed .php read
        # gives @file_get_contents "", so our PHP and JS must never read a site .php themselves.
        working-directory: spikes/b2-wordpress
        run: node --test tests/phpwasm-exports.test.mjs tests/our-file-reads.test.mjs
      - name: The undo log and the request frame on node:sqlite, #60's first CI coverage (issue #352)
        # A new isolate is a new createUndoLog on the same database: lazy open, rollback by recovery, PHP
        # savepoints, commit points, the miss guard, deferred L2 work, row-id reuse, and frames off = #60.
        working-directory: spikes/b2-wordpress
        run: node --test tests/undo-log.test.mjs
      - name: The post-INSERT fault injector, armed, fired and wired (#730, #589 B)
        working-directory: spikes/b2-wordpress
        run: node --test tests/fault-inject.test.mjs
      - name: /_activate names the database failures of its own run (#744)
        working-directory: spikes/b2-wordpress
        run: node --test tests/activate-report.test.mjs
      # Python floor for deploy/wfp temp tests (#644). Was 3.9 via pinned
      # deadsnakes .debs on ubuntu-latest (26.04); Launchpad 503s failed the
      # whole ci job (2026-11-17). The operator Mac is on Homebrew 3.12+ now.
      # setup-python 3.12 works on ubuntu-latest. Last step so it does not
      # change python3 for the steps above. The shell tests call python3.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: deploy/wfp temp tests on Python 3.12 (issue #644)
        run: |
          set -euo pipefail
          python3 -c 'import sys; v = sys.version_info[:2]; assert v == (3, 12), sys.version'
          python3 -I deploy/wfp/tests/fresh-test.py
          python3 -I deploy/wfp/tests/tempdir-clean-test.py
          deploy/wfp/tests/r2-temp-test.sh
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pcov
        run: |
          # ubuntu-latest moved to 26.04, which has no php8.3-pcov. Install pcov for the
          # runner's own PHP instead of naming a version, so the next image bump does not
          # break this step again.
          sudo apt-get update -q && sudo apt-get install -y -q php-cli php-pcov
          v=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          echo "runner PHP $v"
          sudo phpenmod -v "$v" -s cli pcov
          php -m | grep -i pcov
      - name: Fetch the SQLite driver
        run: |
          git clone -q https://github.com/WordPress/sqlite-database-integration spikes/b2-wordpress/build/cache/sqlite-database-integration
          git -C spikes/b2-wordpress/build/cache/sqlite-database-integration checkout -q "$SQLITE_DI_REF"
      - name: Dialect coverage
        run: php -d pcov.enabled=1 spikes/b2-wordpress/tests/coverage.php 0
