# Generated by deploy/wfp for site letters (b-dosql in namespace wp-wfp). Do not edit.
name = "site-letters"
main = "index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
send_email = [{ name = "EMAIL", allowed_sender_addresses = ["shop@example.com"] }]
[assets]
directory = "build/public"
[cache]
enabled = true
[exports.default]
type = "worker"
[exports.default.cache]
enabled = false
[exports.Pages]
type = "worker"
[exports.Pages.cache]
enabled = true
[vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
SITE_ORIGIN = "https://letters.example.com"
MAIL_FROM = "shop@example.com"
MAIL_FROM_NAME = "Test Shop"
HTTP_ALLOW_HOSTS = ".wordpress.org,.woocommerce.com,.gravatar.com"

PHP_IN_DO = "on"
PHP_LOCATION = "enam"
PHP_DO_POOL = "1"
DB_IN_DO = "on"
[images]
binding = "IMAGES"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wp-wfp-letters-media"
[[durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]

[observability]
enabled = false
