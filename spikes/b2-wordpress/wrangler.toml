name = "b2-wordpress"
main = "index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]

[assets]
directory = "build/public"

[[d1_databases]]
binding = "DB"
database_name = "b2-local"
database_id = "00000000-0000-0000-0000-000000000002"

# Deploy to your own account on workers.dev. Replace database_id with the id from `wrangler d1 create`.
# Secrets: WP_SALT, SPIKE_TOKEN (wrangler secret put --env live).
[env.live]
name = "wp-on-d1-spike"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]

[env.live.vars]
# PHP's own allocator wastes WebAssembly memory on 2 MB-aligned chunks.
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'

[env.live.assets]
directory = "build/public"

# Measured 2026-11-03: this account is on Workers Free (a cpu_ms limit is refused
# with code 100328). Requests stop at about 2 s of CPU (exceededResources).
# On Paid, add: [env.live.limits] cpu_ms = 30000

[env.live.placement]
mode = "smart"

[[env.live.d1_databases]]
binding = "DB"
database_name = "wp-on-d1-spike"
database_id = "c4b12ebc-b3c7-49ed-9352-061ead0f65bb"
