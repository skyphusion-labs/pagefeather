name = "b2-wordpress"
main = "index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]

send_email = [{ name = "EMAIL" }]
[assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"

# Page cache in front of the Worker (Workers Cache). index.js decides what is cacheable.
[cache]
enabled = true
# Only the Pages entrypoint is cached (issue #63). The default entrypoint is
# the gateway: it sends a page request with no WordPress cookie to Pages
# without its Cookie header, so other cookies do not split the cache key.
# exports is inherited by every [env.*]; each [env.*.cache] turns caching on.
[exports.default]
type = "worker"
  [exports.default.cache]
  enabled = false
[exports.Pages]
type = "worker"
  [exports.Pages.cache]
  enabled = true

[[d1_databases]]
binding = "DB"
database_name = "b2-local"
database_id = "00000000-0000-0000-0000-000000000002"

# Media library (php/r2-uploads.php). Without this binding, uploads stay in memory.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "b2-local-media"

# Image sizes (php/cf-images-editor.php). Local dev uses an offline version.
[images]
binding = "IMAGES"

# Workers AI (php/ai-alt-text.php): auto alt text for uploaded images. b-dosql only.
[ai]
binding = "AI"

# Browser Rendering (php/pdf-invoice.php, issue #227): render WooCommerce orders to real
# PDF invoices at the edge. b-dosql + MEDIA only; the PDF is stored under a private
# invoices/ prefix in the MEDIA bucket. The signed, expiring download link is minted by
# the Worker with INVOICE_TOKEN (a secret), so PHP relays the URL and never holds it:
#   wrangler secret put INVOICE_TOKEN --env <env>   # any long random string; the HMAC key
#   INVOICE_URL_TTL = "604800"                       # optional [vars]: link lifetime (s), default 7d
#   PDF_INVOICE = "off"                              # optional off switch
# With the BROWSER and MEDIA bindings present (and PHP_IN_DO/DB_IN_DO on), index.js
# injects define('SKYPHUSION_PDF_INVOICE', true); absent, it is a no-op. Browser
# Rendering is a Paid feature and does not run in local wrangler dev, so add the binding
# (and INVOICE_TOKEN) to the deploy env you render on, not to local dev.
[browser]
binding = "BROWSER"

# Zone cache purge-on-publish (php/zone-cache-purge.php, issue #205). The zone
# lever (deploy/zone/) caches anonymous HTML at the Cloudflare edge; this purges
# it when content changes. Set these ONLY on a deploy behind a real zone with the
# deploy/zone/ cache rule (not a workers.dev deploy, which has no zone):
#   wrangler secret put PURGE_TOKEN --env <env>   # scoped: Zone > Cache Purge, one zone
#   PURGE_ZONE  = "<zone id>"                     # a [vars] entry, not a secret
#   CACHE_PURGE = "off"                           # optional off switch
# With PURGE_TOKEN and PURGE_ZONE both present (and PHP_IN_DO/DB_IN_DO on), index.js
# injects define('SKYPHUSION_CACHE_PURGE', true) and the plugin is active; absent, it
# is a no-op. The token stays in the Worker and never reaches PHP.

# Workers Free deploy, on workers.dev. Replace database_id with the id from `wrangler d1 create`.
# Secrets: WP_SALT, SPIKE_TOKEN (wrangler secret put --env free).
[env.free]
send_email = [{ name = "EMAIL" }]
name = "wp-on-d1-spike"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]

[env.free.vars]
# PHP's own allocator wastes WebAssembly memory on 2 MB-aligned chunks.
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'

[env.free.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"

# Measured 2026-11-03: this account is on Workers Free (a cpu_ms limit is refused
# with code 100328). Requests stop at about 2 s of CPU (exceededResources).

[env.free.images]
binding = "IMAGES"

[env.free.cache]
enabled = true

[env.free.placement]
mode = "smart"

[[env.free.d1_databases]]
binding = "DB"
database_name = "wp-on-d1-spike"
database_id = "c4b12ebc-b3c7-49ed-9352-061ead0f65bb"

# R2 is not on for the Free test account: bucket create fails with code 10042,
# "Please enable R2 through the Cloudflare Dashboard" (2026-11-04). After that, add:
# [[env.free.r2_buckets]] binding = "MEDIA", bucket_name = "wp-on-d1-free-media"

# Workers Paid deploy, on workers.dev. Replace database_id with the id from `wrangler d1 create`.
# Secrets: WP_SALT, SPIKE_TOKEN (wrangler secret put --env paid).
[env.paid]
send_email = [{ name = "EMAIL" }]
name = "wp-on-d1-paid"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]

[env.paid.vars]
# PHP's own allocator wastes WebAssembly memory on 2 MB-aligned chunks.
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
# Checkout Container instance name; change it to start a new instance on the current image.
CHECKOUT_INSTANCE = "checkout"

[env.paid.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"

# Paid allows up to 5 minutes of CPU per request; 30 s is its default. Set here so it is visible.
[env.paid.limits]
cpu_ms = 30000

[env.paid.cache]
enabled = true

[env.paid.placement]
# Next to the D1 primary. Measured 2026-11-04 (/_d1ping, 20 calls): smart or
# us-east regions 35 to 40 ms per D1 call; aws:us-east-2 (runs in ORD) 14 to 29 ms.
region = "aws:us-east-2"

[[env.paid.d1_databases]]
binding = "DB"
database_name = "wp-on-d1-paid"
database_id = "d6643778-509f-4dc0-871b-a7859d888a00"

[[env.paid.r2_buckets]]
binding = "MEDIA"
bucket_name = "wp-on-d1-paid-media"

[env.paid.images]
binding = "IMAGES"

# Checkout Container (issue #20): off. The B+C split is superseded by approach
# C1 (WooCommerce and SQLite in one Container, docs/approach-c1.md). The class and
# binding stay (removing a Durable Object class needs a migration); there is no
# container application, and index.js routes to it only with CHECKOUT_CONTAINER=on.
[[env.paid.durable_objects.bindings]]
name = "WOO_CHECKOUT"
class_name = "WooCheckout"

[[env.paid.migrations]]
tag = "v1"
new_sqlite_classes = ["WooCheckout"]

# ---------------------------------------------------------------------------
# Approach A: the same Worker on MySQL through Hyperdrive (index-a.js,
# php/hyperdrive-db.php, ENGINE=a ./build.sh). The database is MariaDB on a
# Vultr box in Chicago, reached through a Cloudflare Tunnel with an Access
# service token (tests/a/vps.sh, issue #27). Free and Paid share that one
# database with different table prefixes (wpf_ and wp_).
# Secrets per env: WP_SALT, SPIKE_TOKEN.

[env.a-local]
send_email = [{ name = "EMAIL" }]
# opcache.sh with DEV_ENV=a-local. The connection string comes from
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE (a local MariaDB).
main = "index-a.js"
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.a-local.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
[env.a-local.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[[env.a-local.hyperdrive]]
binding = "HYPERDRIVE"
id = "5532e5137adc48509ed4d3a49a42d6ee"
[[env.a-local.r2_buckets]]
binding = "MEDIA"
bucket_name = "b2-local-media"
[env.a-local.images]
binding = "IMAGES"

[env.a-free]
send_email = [{ name = "EMAIL" }]
name = "wp-a-free"
main = "index-a.js"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.a-free.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0","WP_TABLE_PREFIX":"wpf_"}'
[env.a-free.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.a-free.images]
binding = "IMAGES"
[env.a-free.cache]
enabled = true
[env.a-free.placement]
mode = "smart"
[[env.a-free.hyperdrive]]
binding = "HYPERDRIVE"
id = "f66b075f6778493eb02549c3cafa1727"  # wp-a-free-public; tunnel path: 18ebba479f1145869dfca2f4cf00ff02

[env.a-paid]
send_email = [{ name = "EMAIL" }]
name = "wp-a-paid"
main = "index-a.js"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.a-paid.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0","WP_TABLE_PREFIX":"wp_"}'
# Approach-A object cache (#218): dbHandler is set and DB_IN_DO is not on, so
# OBJECT_CACHE=on turns on the cross-isolate-safe allowlist cache. The bracket
# toggles it per request with x-oc-off + the spike token on the SAME binary.
OBJECT_CACHE = "on"
OBJECT_CACHE_GROUPS = "theme_json"  # #491: options never persist on A; #494: terms out
OBJECT_CACHE_TTL = "10"
# Approach-A object cache L2 (#218): a KV store shared across isolates, behind the
# in-isolate Map, so a COLD isolate can hit KV instead of MySQL. Only the groups
# PHP already persists reach it (Woo correctness groups never do). OBJECT_CACHE_L2=on
# turns it on; the OC_KV binding below is the store. Measured against the Hyperdrive hop.
OBJECT_CACHE_L2 = "on"
[env.a-paid.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.a-paid.limits]
cpu_ms = 30000
[env.a-paid.cache]
enabled = true
[env.a-paid.placement]
# Co-located with the MySQL box: Azure MySQL Flexible Server in West US 2
# (wpref-mysql, #218/#32), so Hyperdrive pools near the origin.
region = "aws:us-west-2"
[[env.a-paid.hyperdrive]]
binding = "HYPERDRIVE"
id = "84ab72d4ef5d479a99348b436b44f717"  # wpref-mysql-hd -> Azure MySQL wpref-mysql (West US 2)
[[env.a-paid.r2_buckets]]
binding = "MEDIA"
bucket_name = "wp-a-paid-media"
[env.a-paid.images]
binding = "IMAGES"
# Object-cache L2 store (#218): shared across isolates, so a cold isolate reads KV
# instead of MySQL. Only PHP-persisted groups (the OBJECT_CACHE_GROUPS allowlist and
# salted groups) ever reach it; Woo correctness groups never do.
[[env.a-paid.kv_namespaces]]
binding = "OC_KV"
id = "40e27ef6167e42b18112b931fa46aded"

# Approach A, LEAN client (#218): a byte-for-byte clone of env.a-paid that swaps
# main to index-a-lean.js, so the database runs on the hand-rolled MySQL client
# (mysql-lean.js) and mysql2 is absent from the bundle and the isolate JS heap.
# Same Hyperdrive, same Azure MySQL (wp_ prefix), same object cache + L2 KV, same
# placement. The ONE difference is the MySQL client, so wp-a-lean vs wp-a-paid is
# the measurement of whether reclaiming mysql2's JS heap lets a Woo write fit
# under 128 MiB. Shares the wp_ tables, so run it against the same install.
[env.a-paid-lean]
send_email = [{ name = "EMAIL" }]
name = "wp-a-lean"
main = "index-a-lean.js"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.a-paid-lean.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0","WP_TABLE_PREFIX":"wp_"}'
OBJECT_CACHE = "on"
OBJECT_CACHE_GROUPS = "theme_json"  # #491: options never persist on A; #494: terms out
OBJECT_CACHE_TTL = "10"
OBJECT_CACHE_L2 = "on"
LAZY_NODES = "on"
LAZY_CACHE_MB = "4"
[env.a-paid-lean.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.a-paid-lean.limits]
cpu_ms = 30000
[env.a-paid-lean.cache]
enabled = true
[env.a-paid-lean.placement]
region = "aws:us-west-2"
[[env.a-paid-lean.hyperdrive]]
binding = "HYPERDRIVE"
id = "84ab72d4ef5d479a99348b436b44f717"  # wpref-mysql-hd -> Azure MySQL wpref-mysql (West US 2)
[[env.a-paid-lean.r2_buckets]]
binding = "MEDIA"
bucket_name = "wp-a-paid-media"
[env.a-paid-lean.images]
binding = "IMAGES"
# Workers Logs for the A-vs-B memory comparison (#394): events only (no invocation logs), as
# deploy/wfp OBSERVABILITY=1. The URL query string is redacted after each deploy, because wrangler
# has no key for it: deploy with ./deploy-a-lean.sh, which redacts right after the upload (or turns the logs off).
[env.a-paid-lean.observability]
enabled = true
head_sampling_rate = 1
[env.a-paid-lean.observability.logs]
enabled = true
invocation_logs = false
[[env.a-paid-lean.kv_namespaces]]
binding = "OC_KV"
id = "40e27ef6167e42b18112b931fa46aded"

# Approach A, PHP in a Durable Object + managed MySQL (#218, the overcome-it env).
# PHP_IN_DO=on runs PHP in the PhpRuntime object, its OWN 128 MiB isolate, while
# the database stays external MySQL through Hyperdrive (DB_IN_DO is NOT set, so the
# object's SQLite is not the database; the lean client set by index-a-lean.js runs
# in the object isolate and dials Hyperdrive). This is the single-isolate memory
# wall's only non-container escape: a-paid/a-paid-lean 503 (exceededMemory) on a
# WooCommerce write because PHP's ~99 MiB WASM heap shares one isolate with the JS
# runtime; here PHP gets a dedicated isolate, as b-dosql proved, but the database is
# managed MySQL instead of the object's SQLite. Front Worker keeps assets, R2, cache.
[env.a-paid-do-lean]
send_email = [{ name = "EMAIL" }]
name = "wp-a-do-lean"
main = "index-a-lean.js"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.a-paid-do-lean.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0","WP_TABLE_PREFIX":"wp_"}'
PHP_IN_DO = "on"
LAZY_NODES = "on"
LAZY_CACHE_MB = "4"
OBJECT_CACHE = "on"
OBJECT_CACHE_GROUPS = "theme_json"  # #491: options never persist on A; #494: terms out
OBJECT_CACHE_TTL = "10"
OBJECT_CACHE_L2 = "on"
[env.a-paid-do-lean.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.a-paid-do-lean.limits]
cpu_ms = 30000
[env.a-paid-do-lean.cache]
enabled = true
[env.a-paid-do-lean.placement]
region = "aws:us-west-2"
[[env.a-paid-do-lean.hyperdrive]]
binding = "HYPERDRIVE"
id = "84ab72d4ef5d479a99348b436b44f717"  # wpref-mysql-hd -> Azure MySQL wpref-mysql (West US 2)
[[env.a-paid-do-lean.r2_buckets]]
binding = "MEDIA"
bucket_name = "wp-a-paid-media"
[env.a-paid-do-lean.images]
binding = "IMAGES"
[[env.a-paid-do-lean.kv_namespaces]]
binding = "OC_KV"
id = "40e27ef6167e42b18112b931fa46aded"
[[env.a-paid-do-lean.durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[env.a-paid-do-lean.migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]

# ---------------------------------------------------------------------------
# PHP in a Durable Object (issue #28, docs/approach-b.md 8i). The design is
# from HostlessWP. PHP_IN_DO=on: the Worker serves static assets, R2 uploads
# and the page cache, and sends every request that needs PHP to the PhpRuntime
# object. A Worker request on Free stops at about 2 s of CPU; an object request
# may use 30 s. The default env and env.free/env.paid do not set PHP_IN_DO, so
# their behaviour does not change.

[env.do-local]
send_email = [{ name = "EMAIL" }]
# Local check: DEV_ENV=do-local ./opcache.sh, then DEV_ENV=do-local ./run.sh and ./e2e.sh.
# Same local D1 database as the default env (same database_id).
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.do-local.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
PHP_IN_DO = "on"
[env.do-local.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.do-local.cache]
enabled = true
[[env.do-local.d1_databases]]
binding = "DB"
database_name = "b2-local"
database_id = "00000000-0000-0000-0000-000000000002"
[[env.do-local.r2_buckets]]
binding = "MEDIA"
bucket_name = "b2-local-media"
[env.do-local.images]
binding = "IMAGES"
[[env.do-local.durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[env.do-local.migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]

# Workers Free deploy, on workers.dev. Replace database_id with the id from
# `wrangler d1 create wp-do-free`. Secrets: WP_SALT, SPIKE_TOKEN (--env do-free).
# Free has only SQLite-backed Durable Objects (new_sqlite_classes), 100,000
# object requests and 13,000 GB-s a day (docs/approach-b.md 8i).
[env.do-free]
send_email = [{ name = "EMAIL" }]
name = "wp-do-free"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.do-free.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
PHP_IN_DO = "on"
# Where the object is made (only at its first use). D1's primary is in the
# Chicago area. "enam" is Eastern North America. Measure with /_d1ping.
PHP_LOCATION = "enam"
# Objects that run PHP. 1: one warm runtime, requests one at a time.
PHP_DO_POOL = "1"
[env.do-free.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.do-free.images]
binding = "IMAGES"
[env.do-free.cache]
enabled = true
# No placement: the Worker does no D1 calls in this mode, so it runs near the visitor.
[[env.do-free.d1_databases]]
binding = "DB"
database_name = "wp-do-free-enam"
# Terraform: tests/do/terraform (primary hint enam, the same as PHP_LOCATION).
database_id = "75a6da4c-4ef7-413f-abb6-45e81e13ed2c"
# R2 is not on for the Free test account (code 10042, 2026-11-04). After it is:
# [[env.do-free.r2_buckets]] binding = "MEDIA", bucket_name = "wp-do-free-media"
[[env.do-free.durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[env.do-free.migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]

# ---------------------------------------------------------------------------
# The database inside the PHP object (issue #2, docs/approach-b.md 8j).
# DB_IN_DO=on (only with PHP_IN_DO=on): WordPress's database is the PhpRuntime
# object's own SQLite (ctx.storage.sql), not D1. No network per query. One
# object holds the site, so PHP_DO_POOL does not apply.

[env.dosql-local]
send_email = [{ name = "EMAIL" }]
# Local check: DEV_ENV=dosql-local ./opcache.sh, then DEV_ENV=dosql-local ./run.sh and ./e2e.sh.
# The D1 binding stays here only to compare (/_dbping?db=d1) and to test a move
# from D1 (/_dbexport?from=d1).
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.dosql-local.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
PHP_IN_DO = "on"
DB_IN_DO = "on"
# Durable email retry via Queues (#190): the EMAIL_QUEUE binding below is wired for
# local queue development, but off by default so the default local drain is unchanged.
# Set ASYNC_EMAIL_QUEUE=on (e.g. --var ASYNC_EMAIL_QUEUE:on) to exercise the queue path.
ASYNC_EMAIL_QUEUE = "off"
[env.dosql-local.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/_pf/*"] # #394 L1: the OPcache boot packs are never served (index.js refuses /_pf/)
[env.dosql-local.cache]
enabled = true
[[env.dosql-local.d1_databases]]
binding = "DB"
database_name = "b2-local"
database_id = "00000000-0000-0000-0000-000000000002"
[[env.dosql-local.r2_buckets]]
binding = "MEDIA"
bucket_name = "b2-local-media"
[env.dosql-local.images]
binding = "IMAGES"
[env.dosql-local.ai]
binding = "AI"
[[env.dosql-local.durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[env.dosql-local.migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]

# Durable email retry (#190, Refs #201). Producer: sendPending() enqueues drained
# wp_mail here. Consumer: the queue() export delivers with retry + backoff, routing
# to b2-email-dlq after max_retries; the dlq consumer logs/meters the dead letter.
# A real deploy must provision these queues first (wrangler queues create b2-email;
# wrangler queues create b2-email-dlq) and add the same bindings to the deploy env.
[[env.dosql-local.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "b2-email"
[[env.dosql-local.queues.consumers]]
queue = "b2-email"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "b2-email-dlq"
[[env.dosql-local.queues.consumers]]
queue = "b2-email-dlq"
max_batch_size = 10
max_retries = 1

# Workers Free deploy, on workers.dev. No D1. Secrets: WP_SALT, SPIKE_TOKEN
# (--env dosql-free). The object is made near its first request (no location
# hint: it makes no D1 calls). Free: 1 GB per object, 5 GB per account.
[env.dosql-free]
send_email = [{ name = "EMAIL" }]
name = "wp-dosql-free"
workers_dev = true
rules = [{ type = "Data", globs = ["**/*.zip"], fallthrough = false }]
[env.dosql-free.vars]
PHP_ENV = '{"USE_ZEND_ALLOC":"0"}'
PHP_IN_DO = "on"
DB_IN_DO = "on"
[env.dosql-free.assets]
directory = "build/public"
binding = "ASSETS"
not_found_handling = "none"
[env.dosql-free.images]
binding = "IMAGES"
[env.dosql-free.ai]
binding = "AI"
[env.dosql-free.cache]
enabled = true
[[env.dosql-free.durable_objects.bindings]]
name = "PHP_RUNTIME"
class_name = "PhpRuntime"
[[env.dosql-free.migrations]]
tag = "v1"
new_sqlite_classes = ["PhpRuntime"]
