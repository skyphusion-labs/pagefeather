; Spike C1 (issue #99): the PHP-FPM pool. Installed as
; /usr/local/etc/php-fpm.d/zzz-c1.conf, so it loads after the image's own
; www.conf, docker.conf and zz-docker.conf, and its values win.
[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
; TCP, not a Unix socket: the sampler (entrypoint.sh) reads the backlog of
; port 9000 from /proc/net/tcp. That is the queue of requests that no free
; child took yet.
listen = 127.0.0.1:9000
listen.backlog = 511
; One child per PHP_WORKERS, all started at once. A child takes a new request
; only when it is free, so a slow request holds its own child and nothing else.
pm = static
pm.max_children = ${PHP_WORKERS}
; wp-config.php, kill.php and stats.php read getenv(). FPM clears the
; environment by default.
clear_env = no
; The Worker cuts shopper requests at CONTAINER_TIMEOUT_S (issue #93); admin
; requests (imports, exports) must not be cut here.
request_terminate_timeout = 0
; ping.path needs a free child: c1_check (deploy/variants/c1.sh) uses it to
; prove that PHP answers. pm.status_path is for 127.0.0.1 (nginx.conf).
ping.path = /_fpm-ping
pm.status_path = /_fpm-status
; No line per request on stderr (the image default): the request log is
; /tmp/c1-req.log (c1-prepend.php).
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
; The request log and the x-c1-pid header, for every request that PHP runs.
php_admin_value[auto_prepend_file] = /var/www/html/c1-prepend.php
