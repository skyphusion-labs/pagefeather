# Spike C1 (issue #99): nginx in front of PHP-FPM. It routes as
# container/router.php did under php -S: a static file as it is, a .php file
# runs, a directory with index.php runs it (301 to the trailing slash first),
# and everything else goes to WordPress (/index.php).
user www-data;
worker_processes 1;
pid /run/nginx.pid;
# notice: the start and the graceful stop show in the container log.
error_log /dev/stderr notice;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	server_tokens off;
	absolute_redirect off;
	client_max_body_size 24m;
	access_log off;

	# Idle watchdog (entrypoint.sh): the time of the last request is the
	# modification time of /tmp/last-request. Health checks (/ping, the FPM
	# ping), the test boot id and the container's own queue runner (wp-cron.php
	# from 127.0.0.1) do not count, or they would keep the container awake.
	map "$remote_addr $request_uri" $c1_active {
		"~^127\.0\.0\.1 /wp-cron\.php(\?|$)" 0;
		"~^\S+ /(ping|_boot\.txt|_fpm-ping|_fpm-status)(\?|$)" 0;
		default 1;
	}
	log_format c1_activity "$msec";
	access_log /tmp/last-request c1_activity if=$c1_active;

	upstream php {
		server 127.0.0.1:9000;
	}

	server {
		listen 80 default_server;
		root /var/www/html;

		# A directory without the trailing slash: 301 first, so relative links in
		# wp-admin work (found 2026-11-05 by tests/plugins/plugins.py).
		if (-d $request_filename) {
			rewrite ^(.*[^/])$ $1/ permanent;
		}

		location = /_fpm-ping {
			include fastcgi.conf;
			fastcgi_pass php;
		}
		location = /_fpm-status {
			allow 127.0.0.1;
			deny all;
			include fastcgi.conf;
			fastcgi_pass php;
		}

		# A path that ends in a slash: its index.php, else WordPress, both by a
		# rewrite, so that the PHP location below runs them for every method.
		# Two ways that are wrong, both measured (issue #99):
		# - "try_files $uri $uri/" and the index module serve a directory with
		#   the static and index handlers, which answer 405 to PUT, PATCH and
		#   DELETE (REST writes to /?rest_route=... failed: tests/cache_check.py
		#   and tests/break.py on wp-c1-perf).
		# - "try_files ${uri}index.php ...": only the LAST try_files argument is
		#   an internal redirect; a file that an earlier argument finds is served
		#   by this location, statically. That sent the PHP SOURCE of index.php
		#   for GET / and 405 for every other method (tests/nginx-route-test.sh).
		location ~ /$ {
			if (-f ${request_filename}index.php) {
				rewrite ^(.*)$ $1index.php last;
			}
			rewrite ^ /index.php last;
		}
		# Any other path: the file as it is, else WordPress. The 301 above means
		# a directory never gets here without its slash.
		location / {
			try_files $uri /index.php$is_args$args;
		}

		location ~ \.php$ {
			# A .php path that does not exist goes to WordPress, as with router.php.
			try_files $uri /index.php$is_args$args;
			include fastcgi.conf;
			fastcgi_param HTTP_PROXY "";
			# Admin imports and exports can run long. The Worker cuts shopper
			# requests at CONTAINER_TIMEOUT_S (issue #93).
			fastcgi_read_timeout 3600s;
			fastcgi_send_timeout 3600s;
			fastcgi_pass php;
		}
	}

	# The warm-up (issue #92, container/warm.php), called once per start by
	# c1-serve.sh. A server of its own on 127.0.0.1:8081, not a location on port
	# 80: the Worker reaches port 80 only, whatever source address the
	# platform's proxy gives it inside the container, so nothing from outside
	# can run warm.php. The allow and deny are a second line. No access log: the
	# warm-up is not a shopper, so it must not keep the container awake.
	server {
		listen 127.0.0.1:8081;
		access_log off;
		allow 127.0.0.1;
		deny all;
		location = /_warm {
			include fastcgi.conf;
			fastcgi_param SCRIPT_FILENAME /opt/wp/warm.php;
			fastcgi_param HTTP_PROXY "";
			fastcgi_read_timeout 300s;
			fastcgi_pass php;
		}
		location / {
			return 404;
		}
	}
}
